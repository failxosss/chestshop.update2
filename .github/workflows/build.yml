name: Build SimpleShop

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v4

      - name: Nastaveni JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (mvn package)
        run: mvn -B package --file pom.xml

      - name: Nahrat hotovy jar jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleShop-jar
          path: target/SimpleShop.jar
